# Hand-tagged ground truth for the event engine (issue #16).
#
# windows:        footage that was reviewed. Recall only counts blockages inside these.
# blockages:      real incidents: a vehicle stopped where it blocks traffic.
# not_blockages:  alerts we checked and rejected, with the reason. An alert matching
#                 neither list is "unreviewed" and gets flagged for a human.
#
# Times are UTC. bbox is [x1, y1, x2, y2] in 352x240 frame pixels, roughly where the
# vehicle stood. start/end marked clipped were cut off by the recording, so they're
# excluded from time-to-alert. category lets the report show results with and without
# debatable groups (bus_lane, police, camera_moved). demo: true marks the incidents the
# demo replays (docs/demo.md); tests/test_demo_incidents.py checks they still alert.
#
# Verdict rule: does it block traffic? Parked (even illegally) out of the flow = not a blockage.
#
# Congestion (issue #47), at the end of the file:
# congestion_windows:  footage reviewed for congestion. Inside one, the camera is free except
#                      during its congestion intervals.
# congestion:          intervals where traffic is slow or congested (a jam: it doesn't clear on
#                      green). approach is optional (the mask's approach name).

