# Dwell thresholds and rule knobs. Tune during the event without code changes.
dwell_s:                 # seconds a vehicle must stay still in a zone before an event opens
  double_parked: 60      # curb_adjacent zones
  stopped_in_lane: 75    # travel zones. Was 120 (> one signal cycle); on evaluation/ 75 catches
                         # taxis blocking a lane for 90-100 s with no extra false alerts (red-light
                         # queues are handled by front-of-queue + min_seen_frac). Watch it.
  blocked_box: 30        # box zones; 20 fired on cabs waiting ~20 s to turn while pedestrians cross
  bus_stop: 120          # any vehicle in a bus_stop zone (buses leave within ~30-60 s);
                         # reported as double_parked. Class is never used: the detector
                         # labels delivery trucks and cabs as "bus"
  frozen_feed: 30        # identical frames for this long

signal_cycle_s: 90
track_lost_frames: 3
edge_margin_px: 2        # no events for boxes touching the frame edge: the vehicle is cut off,
                         # so its box bottom-center isn't where it touches the road
edge_sides: true         # also the left/right edges, not just the bottom (evaluation/: removed
                         # 2 false alerts, no real blockage lost)

stationary:
  # still = at least `min_still_edges` of the 4 box edges moved < max_edge_shift_frac of the
  # box diagonal, and IoU > min_iou. Edges, not the center: occlusion (a passing car hiding a
  # parked truck's bottom) moves one edge; driving moves two or more.
  max_edge_shift_frac: 0.05
  min_still_edges: 3
  min_iou: 0.5
  reset_after_frames: 2   # moved frames in a row (vs where it parked) before the timer resets;
                          # 1 would let a single glitchy box wipe out the stationary time
  min_seen_frac: 0.7      # an event opens only if the vehicle was detected in at least this share
                          # of its still streak's frames (different buses passing one spot leave
                          # gaps). Tuned on evaluation/: 0.8+ starts losing real blockages

tracking:
  match_iou: 0.3   # min overlap to link a box to an existing track (frames are 2-5 s apart)
  start_conf: 0.35 # detections at least this confident start and continue tracks
  keep_conf: 0.35  # set lower to let weaker detections continue (never start) a track, at an
  keep_iou: 0.5    # overlap >= keep_iou. Off (= start_conf): tried 0.15-0.25 on evaluation/, it
                   # keeps the flickering tow truck tracked but also keeps queued cars "well
                   # seen", so precision fell 82% -> 36-45% with no recall gain
  max_gap_s: 30    # a track unseen for longer ends, even if fewer than track_lost_frames were
                   # missed (recording gaps, restarts): nobody saw the vehicle stay put

flow:                    # a stopped vehicle is a blockage only if traffic kept moving past it
  min_passing_per_min: 4 # hold double_parked / stopped_in_lane events while fewer vehicles than
                         # this passed it per minute (a jam); 0 = off. On evaluation/ (issue #47)
                         # 3-6 with window 60-120 s all give precision 82% -> 90% (drops the
                         # 6 Ave @ 30 St jam alert), recall and time to alert unchanged
  window_s: 90           # measured over the last signal cycle of its still streak
  near_height_frac: 2.5  # "past it" = a new track whose box bottom is within this x the
                         # stopped vehicle's height of its bottom (1.5 loses the cab pickup
                         # gt_004 at 3+/min: few cars pass close to a small box)

congestion:              # per-camera free / slow / congested state (events/congestion.py)
  min_conf: 0.35         # detections counted as vehicles. On the 21 tagged windows (evaluation/,
                         # issue #47) 0.25 / 0.15 catch 3-5 of 7 slow intervals instead of 1, but
                         # red-light queues at busy junctions then read slow too (77-600 false
                         # frames of 3465, most runs false): the night queue is barely detected
  stuck_iou: 0.5         # a vehicle overlapping a box of the previous frame this much hasn't moved
  bin_s: 30              # the stuck share is measured per bin...
  window_s: 180          # ...and a jam is when no bin of the last 2 signal cycles clears
  max_gap_s: 30          # frames further apart than this aren't compared (recording gaps)
  slow_floor: 0.3        # lowest stuck share of any bin in the window, for slow / congested
  congested_floor: 0.5
  min_occupancy: 0.15    # share of the approach covered by vehicles, below which it's free
  full_occupancy: 0.4    # occupancy at which the score reaches the floor
  cell_px: 4             # grid used to measure occupancy
  min_vehicles: 0        # also busy at this many vehicles per frame (far cars cover little area);
                         # 0 = off. 2-4 lifted recall like a lower min_conf, with as many false runs
  far_split: 0           # > 0: judge the top this share of each approach separately ("<name>_far");
                         # 0 = off. 0.5 alone: +1 slow interval, 29 false runs of 31
  exit_floor_drop: 0.2   # hysteresis: a level is left only when the floor drops this much below the
                         # threshold that entered it. The 6 Ave @ 30 St jam: 9 congested runs
                         # (flickering with slow) -> 1; free frames read busy 5 -> 7 of 3465
  exit_occupancy: 0.15   # ...and when occupancy drops below this (lower = hold longer; 0.07-0.1
                         # added false frames at night)

queue:                   # only the front vehicle of a queue in a travel lane is an event;
  max_gap_frac: 0.6      # stopped vehicles closer than this x the vehicle's height behind it
  min_x_overlap: 0.3     # and overlapping sideways by this fraction are queued behind it

view:                    # paused when the camera pans/zooms away from its mask's reference frame
  min_similarity: 0.3    # edge similarity (events/view.py): unmoved cameras 0.49-0.88, the 8 Ave
                         # @ 34 St camera after zooming out 0.11 (2026-09-26)
  pause_after_frames: 3
  resume_after_frames: 3
