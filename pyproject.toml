[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-watch"
version = "0.1.0"
description = "Detect vehicles blocking NYC traffic from DOT cameras and recommend signal retiming, validated in SUMO."
readme = "README.md"
requires-python = ">=3.10"  # plan targets 3.11; 3.10 works too
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
# Vision lead: detector + tracker
vision = [
    "ultralytics>=8.3",
    "supervision>=0.22",
    "opencv-python-headless>=4.9",
]
# Sim lead: SUMO + TraCI (eclipse-sumo ships the binaries)
sim = [
    "eclipse-sumo>=1.20",
    "traci>=1.20",
    "sumolib>=1.20",
]
# Product lead: incident summaries
llm = ["anthropic>=0.40"]
# Operator dashboard (Streamlit; pydeck ships with it). Also in dev so CI runs its smoke test.
dashboard = ["streamlit>=1.60"]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "ruff>=0.4", "streamlit>=1.60"]
all = ["lane-watch[vision,sim,llm,dev]"]

[tool.setuptools]
packages = ["common", "ingest", "vision", "events", "signals", "sim", "api", "dashboard"]

[tool.setuptools.package-data]
events = ["rules.yaml"]
ingest = ["placeholders/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
