# Demand targets. Bands are 15 Penn FEIS midday vehicles/hour, times pricing_factor
# at route build. Every key is listed in sim/sources/sources.yaml.

pricing_factor: 0.89
saturday_factor: 0.85
seed: 42
warmup_s: 300
duration_s: 900
lincoln_tunnel_share: 0.22

mix:
  passenger: 0.85
  taxi: 0.10
  truck: 0.05

buses:
  "34 St": 12
  avenue: 8

# Sensitivity multipliers used by validate.py (0.7x / 1.0x / 1.3x).
multipliers: [0.7, 1.0, 1.3]

periods:
  weekday_midday:
    corridors:
      "8 Ave": [1400, 1600]
      "7 Ave": [1200, 1600]
      "6 Ave": [1400, 1600]
      Broadway: [500, 700]
      "5 Ave": [1200, 1400]
      "9 Ave": [1000, 1400]
      "34 St": [700, 1100]
    streets: [100, 900]
  saturday_midday:
    corridors:
      "8 Ave": [1200, 1400]
      "7 Ave": [1000, 1400]
      "6 Ave": [1200, 1400]
      Broadway: [400, 600]
      "5 Ave": [1000, 1200]
      "9 Ave": [850, 1200]
      "34 St": [550, 900]
    streets: [80, 750]
